# ============================================================
# Differential Privacy Configuration — The Sentinel Ego
# ============================================================
# PAPER CHOICE: sigma=2.0 → epsilon=13.7792
#
# Formula: epsilon = alpha/(2*sigma^2) * rounds + ln(1/delta)/(alpha-1)
#        = 10/(2*4.0) * 10 + ln(100000)/9
#        = 12.5 + 1.2792
#        = 13.7792
#
# Valid for: 10 rounds × 10 nodes, alpha=10, delta=1e-5, C=1.0
# ============================================================

differential_privacy:
  mechanism: "Gaussian"
  accounting_method: "Renyi_DP"
  alpha: 10
  delta: 1.0e-5
  clipping_norm: 1.0

  # Full comparison table (EX-1)
  sigma_configs:
    - sigma: 0.5
      rdp: 800.0
      epsilon: 201.2792
      note: "Too weak"
    - sigma: 1.0
      rdp: 50.0
      epsilon: 51.2792
      note: "Weak — epsilon>10 for 10 rounds x 10 nodes, not publishable"
    - sigma: 1.5
      rdp: 22.2222
      epsilon: 23.5014
      note: "Borderline"
    - sigma: 2.0
      rdp: 12.5
      epsilon: 13.7792
      note: "PAPER CHOICE — practical privacy-utility tradeoff"
    - sigma: 3.0
      rdp: 5.5556
      epsilon: 6.8348
      note: "Stronger privacy, higher noise penalty"

  # Paper claim — Section 5.3
  paper_claim:
    sigma: 2.0
    clipping_norm: 1.0
    epsilon: 13.7792
    delta: 1.0e-5
    alpha: 10
    n_rounds: 10
    n_nodes: 10
    statement: >
      We select sigma=2.0, yielding a (13.7792, 1e-5)-DP guarantee per
      Renyi Differential Privacy accounting (RDP, alpha=10) over 10
      federated rounds across 10 Ego nodes. The noise multiplier is
      applied at gradient clipping norm C=1.0. This reflects a practical
      privacy-utility tradeoff consistent with deployed federated learning
      systems [McMahan et al., 2018].

  # NOTE on phase3_dp_guarantee.csv
  # That file shows sigma=1.0 -> dp_eps=1.2802 with rdp_eps=0.5000.
  # rdp_eps=0.5 = alpha/(2*sigma^2) for ONE step only (no rounds multiplier).
  # This does NOT apply to the full 10-round x 10-node experiment.
  # For the full experiment: sigma=1.0 gives epsilon=51.2792, NOT 1.2802.
  # The correct paper guarantee is epsilon=13.7792 at sigma=2.0.
